name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6

      - name: Compile check
        run: python -m compileall -q catclock cat_clock.py tools

      - name: Smoke + render preview
        run: python tools/smoke.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-states
          path: preview_states.png
          if-no-files-found: ignore
