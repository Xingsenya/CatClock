name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Build exe
        run: pyinstaller CatClock.spec --noconfirm

      - name: Rename with version
        shell: bash
        run: |
          mkdir -p out
          cp dist/CatClock.exe "out/CatClock-${GITHUB_REF_NAME}.exe"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/CatClock-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
